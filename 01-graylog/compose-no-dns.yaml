## Versão alternativa para servidores com DNS local ativo
## Use este arquivo se o compose.yaml falhar com erro de porta 53
##
## Antes de usar, crie a rede:
##   sudo podman network create --disable-dns graylog-net
##
## Para subir:
##   sudo podman-compose -f compose-no-dns.yaml up -d

services:
  mongodb:
    image: docker.io/mongo:7.0
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - graylog-net
    restart: unless-stopped

  opensearch:
    image: docker.io/opensearchproject/opensearch:2.19.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - graylog-net
    restart: unless-stopped

  graylog:
    image: docker.io/graylog/graylog:7.0
    container_name: graylog
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
    ports:
      - "9000:9000"      # Interface web
      - "1514:1514/udp"  # Syslog UDP
      - "1514:1514/tcp"  # Syslog TCP
    depends_on:
      - mongodb
      - opensearch
    networks:
      - graylog-net
    restart: unless-stopped

volumes:
  mongodb_data:
  opensearch_data:

networks:
  graylog-net:
    external: true
