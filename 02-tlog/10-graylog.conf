# /etc/rsyslog.d/10-graylog.conf
# Encaminha logs do tlog para o servidor Graylog via TCP
#
# Substitua IP_DO_GRAYLOG pelo IP real do seu servidor

# Encaminha apenas logs do tlog pro Graylog (TCP)
# Usamos TCP (@@) porque os payloads JSON do tlog podem ser grandes
# e UDP truncaria mensagens que excedem o MTU
if $programname == 'tlog' then @@IP_DO_GRAYLOG:1514;RSYSLOG_SyslogProtocol23Format

# Alternativa: encaminhar TODOS os logs do servidor (não só tlog)
# Descomente a linha abaixo se quiser monitoramento completo
# *.* @@IP_DO_GRAYLOG:1514;RSYSLOG_SyslogProtocol23Format
