# /etc/rsyslog.d/10-graylog.conf
# Encaminha logs para o servidor Graylog
#
# Substitua IP_DO_GRAYLOG pelo IP real do seu servidor

# Encaminha todos os logs pro Graylog (UDP)
*.* @IP_DO_GRAYLOG:1514;RSYSLOG_SyslogProtocol23Format

# Alternativa: encaminhar apenas logs do tlog
# if $programname == 'tlog-rec-session' then @IP_DO_GRAYLOG:1514;RSYSLOG_SyslogProtocol23Format
