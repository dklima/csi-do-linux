# Encaminha logs de autenticação pro Graylog (UDP)
# Instale em /etc/rsyslog.d/ e reinicie o rsyslog:
#   sudo cp 20-graylog-auth.conf /etc/rsyslog.d/
#   sudo systemctl restart rsyslog
#
# Substitua o IP pelo endereço do seu servidor Graylog.
# @ = UDP, @@ = TCP
authpriv.* @192.168.11.90:1514;RSYSLOG_SyslogProtocol23Format
